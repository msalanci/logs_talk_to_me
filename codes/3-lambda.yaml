AWSTemplateFormatVersion: '2010-09-09'
Description: Main lambda function for LTTM project, to integrate with Bedrock

Parameters:
  BedrockModelId:
    Description: ID of the Bedrock model you are using
    Type: String
    Default: us.anthropic.claude-3-7-sonnet-20250219-v1:0

Resources:
  LttmMainFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: LttmMainFunction
      Handler: index.lambda_handler
      Role: !ImportValue LttmLambdaRoleArn
      Runtime: python3.12
      Timeout: 60
      MemorySize: 128
      Environment:
        Variables:
          CLOUDTRAIL_EVENT_DATA_STORE_ID: !ImportValue EventDataStoreId # If using imported one
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Code:
        ZipFile: |
            import json
            import botocore
            import boto3
            import os
            import time
            import datetime
            import re

            print("boto3 version:", boto3.__version__)
            print("botocore version:", botocore.__version__)

            EVENT_DATA_STORE_ID = os.environ['CLOUDTRAIL_EVENT_DATA_STORE_ID']
            BEDROCK_MODEL_ID = os.environ['BEDROCK_MODEL_ID']

            cloudtrail = boto3.client('cloudtrail', region_name='eu-central-1')
            bedrock_runtime = boto3.client('bedrock-runtime', region_name='us-west-2')

            def parse_timeframe_to_hours(timeframe_text):
                if not timeframe_text:
                    return None

                timeframe_text = timeframe_text.lower()
                number_match = re.search(r'(\d+)', timeframe_text)
                if not number_match:
                    return None

                value = int(number_match.group(1))

                # Default unit
                multiplier = 1  # assume hours

                # Match unit keywords
                if 'second' in timeframe_text or 'seconds'in timeframe_text:
                    multiplier = 1 / 3600  # convert seconds to hours
                elif 'minute' in timeframe_text or 'minutes' in timeframe_text:
                    multiplier = 1 / 60    # convert minutes to hours
                elif 'hour' in timeframe_text or 'hours' in timeframe_text:
                    multiplier = 1
                elif 'day' in timeframe_text or 'days' in timeframe_text:
                    multiplier = 24
                elif 'week' in timeframe_text or 'weeks' in timeframe_text:
                    multiplier = 24 * 7
                elif 'month' in timeframe_text or 'months' in timeframe_text:
                    multiplier = 24 * 30  # rough estimate
                elif 'year' in timeframe_text or 'years' in timeframe_text:
                    multiplier = 24 * 365

                return int(value * multiplier)

            def parse_lex_event(event):
                try:
                    user_input = event['inputTranscript']
                    intent_name = event['sessionState']['intent']['name']
                    slots = event['sessionState']['intent'].get('slots', {})
                except KeyError as e:
                    print(f"Error parsing event: {e}")
                    user_input = ""
                    intent_name = "Unknown"
                    slots = {}
                return user_input, intent_name, slots

            def build_query(intent_name, slots):
                timeframehours = slots.get('timeframehours', {}).get('value', {}).get('interpretedValue')
                accountid = slots.get('accountid', {}).get('value', {}).get('interpretedValue')
                username = slots.get('username', {}).get('value', {}).get('interpretedValue')
                ipaddress = slots.get('ipaddress', {}).get('value', {}).get('interpretedValue')

                # timeframe_condition = ""
                # if timeframehours:
                #     try:
                #         hours = int(timeframehours)
                #         timeframe_condition = f"AND eventTime > timestampadd(hour, -{hours}, current_timestamp)"
                #     except ValueError:
                #         timeframe_condition = "" # PROBLEM4 - NEXT CONDITION SHOULD FIX IT
                # timeframe_condition = ""
                # if timeframehours:
                #     try:
                #         hours = int(timeframehours)
                #         # CloudTrail eventTime is in UTC
                #         cutoff_time = datetime.datetime.utcnow() - datetime.timedelta(hours=hours)
                #         cutoff_time_str = cutoff_time.strftime('%Y-%m-%d %H:%M:%S')
                #         timeframe_condition = f"AND eventTime > '{cutoff_time_str}'"
                #     except ValueError:
                #         timeframe_condition = ""

                hours = parse_timeframe_to_hours(timeframehours)

                if hours:
                    cutoff_time = datetime.datetime.utcnow() - datetime.timedelta(hours=hours)
                    cutoff_time_str = cutoff_time.strftime('%Y-%m-%d %H:%M:%S')
                    timeframe_condition = f"AND eventTime > '{cutoff_time_str}'"
                else:
                    timeframe_condition = ""

                # account_condition = f"AND recipientAccountId = '{accountid}'" if accountid else ""
                account_condition = f"AND (recipientAccountId = '{accountid}' OR userIdentity.accountId = '{accountid}')" if accountid else ""
                # username_condition = f"AND userIdentity.userName = '{username}'" if username else "" # REPLACED WITH FOLLOWING CONDITION TO FIX PROBLEM 4
                if username:
                    username_condition = f"AND userIdentity.userName = '{username}'"
                else:
                    username_condition = "AND (userIdentity.userName IS NOT NULL OR userIdentity.userName IS NULL)"

                # ip_condition = f"AND sourceIPAddress = '{ipaddress}'" if ipaddress else ""  # REPLACED WITH FOLLOWING CONDITION TO FIX PROBLEM 4
                if ipaddress:
                    ip_condition = f"AND sourceIPAddress = '{ipaddress}'"
                else:
                    ip_condition = "AND (sourceIPAddress IS NOT NULL OR sourceIPAddress IS NULL)"

                # if intent_name == "ExplainCloudTrailLogIntent":
                #     query_statement = f"""
                #         SELECT eventTime, eventName, userIdentity.arn, sourceIPAddress
                #         FROM {EVENT_DATA_STORE_ID}
                #         WHERE eventSource = 'signin.amazonaws.com'
                #         AND eventName = 'ConsoleLogin'
                #         AND errorMessage IS NOT NULL
                #         {account_condition}
                #         {timeframe_condition}
                #         {username_condition}
                #         {ip_condition}
                #         ORDER BY eventTime DESC
                #         LIMIT 10
                #     """
                if intent_name == "ListApiCallsByUserIntent":
                    query_statement = f"""
                        SELECT eventTime, eventSource, eventName, userIdentity.arn, sourceIPAddress
                        FROM {EVENT_DATA_STORE_ID}
                        WHERE userIdentity.type = 'IAMUser'
                        {username_condition}
                        {account_condition}
                        {timeframe_condition}
                        {ip_condition}
                        ORDER BY eventTime DESC
                        LIMIT 100
                    """
                elif intent_name == "ShowActivitiesFromIPAddressIntent":
                    query_statement = f"""
                        SELECT eventTime, eventSource, eventName, sourceIPAddress, userIdentity.arn
                        FROM {EVENT_DATA_STORE_ID}
                        WHERE 1=1
                        {ip_condition}
                        {account_condition}
                        {timeframe_condition}
                        {username_condition}
                        ORDER BY eventTime DESC
                        LIMIT 100
                    """
                elif intent_name == "FindSuccessfulOperationsIntent":
                    query_statement = f"""
                        SELECT eventTime, eventSource, eventName, userIdentity.arn, sourceIPAddress
                        FROM {EVENT_DATA_STORE_ID}
                        WHERE errorCode IS NULL
                        {account_condition}
                        {timeframe_condition}
                        {username_condition}
                        {ip_condition}
                        ORDER BY eventTime DESC
                        LIMIT 100
                    """
                elif intent_name == "FindFailedOperationsIntent":
                    query_statement = f"""
                        SELECT eventTime, eventSource, eventName, errorCode, userIdentity.arn, sourceIPAddress
                        FROM {EVENT_DATA_STORE_ID}
                        WHERE errorCode IS NOT NULL
                        {account_condition}
                        {timeframe_condition}
                        {username_condition}
                        {ip_condition}
                        ORDER BY eventTime DESC
                        LIMIT 100
                    """
                elif intent_name == "ListUsersInAccountIntent":
                    query_statement = f"""
                        SELECT DISTINCT userIdentity.userName, userIdentity.arn, sourceIPAddress
                        FROM {EVENT_DATA_STORE_ID}
                        WHERE userIdentity.userName IS NOT NULL
                        {account_condition}
                        {timeframe_condition}
                        ORDER BY userIdentity.userName ASC
                        LIMIT 100
                    """
                elif intent_name == "ListSuccessfulLoginsIntent":
                    query_statement = f"""
                        SELECT eventTime, eventName, userIdentity.arn, sourceIPAddress
                        FROM {EVENT_DATA_STORE_ID}
                        WHERE eventSource = 'signin.amazonaws.com'
                        AND eventName = 'ConsoleLogin'
                        AND errorMessage IS NULL
                        {account_condition}
                        {timeframe_condition}
                        {username_condition}
                        {ip_condition}
                        ORDER BY eventTime DESC
                        LIMIT 100
                    """
                elif intent_name == "ListFailedLoginsIntent":
                    query_statement = f"""
                        SELECT eventTime, eventName, errorMessage, userIdentity.arn, sourceIPAddress
                        FROM {EVENT_DATA_STORE_ID}
                        WHERE eventSource = 'signin.amazonaws.com'
                        AND eventName = 'ConsoleLogin'
                        AND errorMessage IS NOT NULL
                        {account_condition}
                        {timeframe_condition}
                        {username_condition}
                        {ip_condition}
                        ORDER BY eventTime DESC
                        LIMIT 100
                    """
                elif intent_name == "SummarizeLoginActivitiesIntent":
                    query_statement = f"""
                        SELECT eventTime, eventName, userIdentity.arn, sourceIPAddress
                        FROM {EVENT_DATA_STORE_ID}
                        WHERE eventSource = 'signin.amazonaws.com'
                        AND eventName = 'ConsoleLogin'
                        {account_condition}
                        {timeframe_condition}
                        {username_condition}
                        {ip_condition}
                        ORDER BY eventTime DESC
                        LIMIT 100
                    """
                elif intent_name == "ListUserIPAddressesIntent":
                    query_statement = f"""
                        SELECT DISTINCT sourceIPAddress, userIdentity.userName, userIdentity.arn
                        FROM {EVENT_DATA_STORE_ID}
                        WHERE sourceIPAddress IS NOT NULL
                        {account_condition}
                        {timeframe_condition}
                        ORDER BY sourceIPAddress ASC
                        LIMIT 100
                    """
                else:
                    query_statement = f"""
                        SELECT eventTime, eventName, userIdentity.arn, sourceIPAddress
                        FROM {EVENT_DATA_STORE_ID}
                        WHERE eventTime > timestampadd(hour, -1, current_timestamp)
                        {account_condition}
                        {username_condition}
                        {ip_condition}
                        ORDER BY eventTime DESC
                        LIMIT 100
                    """
                return query_statement

            def start_cloudtrail_query(query_statement):
                try:
                    response = cloudtrail.start_query(QueryStatement=query_statement)
                    query_id = response['QueryId']
                    print(f"Started CloudTrail query: {query_id}")
                    return query_id
                except cloudtrail.exceptions.InsufficientS3BucketPolicyException as e:
                    print(f"S3 bucket policy error: {e}")
                    return None
                except cloudtrail.exceptions.InsufficientEncryptionPolicyException as e:
                    print(f"Encryption policy error: {e}")
                    return None
                except Exception as e:
                    print(f"Error starting query: {e}")
                    return None

            def get_query_results(query_id):
                attempts = 0
                max_attempts = 10
                while attempts < max_attempts:
                    try:
                        print(f"Attempt {attempts + 1}: Getting query results for query ID {query_id}")
                        result = cloudtrail.get_query_results(QueryId=query_id)
                        status = result.get('QueryStatus')
                        print(f"Query status: {status}")

                        if status == 'FINISHED':
                            results = result.get('QueryResultRows', [])
                            print(f"Query completed. Found {len(results)} results")
                            return results
                        elif status in ['FAILED', 'CANCELLED']:
                            print(f"Query failed with status: {status}")
                            return []
                        else:
                            print(f"Query still running. Waiting...")
                            time.sleep(2)
                            attempts += 1
                    except Exception as e:
                        print(f"Error getting query results: {e}")
                        return []

                print(f"Query timed out after {max_attempts} attempts")
                return []

            def extract_number(text):
                numbers = re.findall(r'\d+', text)
                if numbers:
                    return int(numbers[0])
                return None

            def summarize_with_bedrock(events_list, intent_name, user_input, limit_number=None):
                if not events_list:
                    return "No matching CloudTrail events found."

                print(f"Preparing to summarize {len(events_list)} events")

                # Extract number from user_input
                requested_number = extract_number(user_input)

                # Detect if this number is time-related
                time_unit_keywords = [
                    'second', 'seconds',
                    'minute', 'minutes',
                    'hour', 'hours',
                    'day', 'days',
                    'week', 'weeks',
                    'month', 'months',
                    'year', 'years'
                ]

                is_time_related = False
                if requested_number:
                    for keyword in time_unit_keywords:
                        if keyword in user_input.lower():
                            is_time_related = True
                            break

                # Decide limit for Bedrock based on user input
                if requested_number and not is_time_related and "last" in user_input.lower():
                    limit = requested_number
                else:
                    limit = 30

                print(f"Applying limit of {limit} events to Bedrock prompt.")

                ### Start prompting
                # ## Prompts without user input
                # prompt = (
                #     f"You are summarizing AWS CloudTrail events for the intent '{intent_name}'.\n"
                #     "ONLY include relevant events matching all of these:\n"
                #     "- The requested username (if provided)\n"
                #     "- The requested account ID (if provided)\n"
                #     "- The requested IP address (if provided)\n"
                #     "- The requested timeframe (if provided)\n\n"
                #     "If the events are not related, respond with: 'No relevant events found.'\n\n"
                #     "Here are the events:\n"
                # )

                ### --- ADD USER INPUT at the top ---
                user_question_intro = f'User asked: "{user_input}"\n\n'

                ## Prompts with user input
                # Funny
                if any(word in user_input.lower() for word in ["joke", "funny", "laugh", "hilarious"]):
                    prompt = user_question_intro + (
                        f"You are summarizing AWS CloudTrail events for the intent '{intent_name}'.\n"
                        "ONLY include relevant events matching all of these:\n"
                        "- The requested account ID (if provided)\n"
                        "- The requested IP address (if provided)\n"
                        "- The requested timeframe (if provided)\n\n"

                        "Do not require usernames because failed login attempts may not have usernames.\n\n"

                        "IMPORTANT INSTRUCTIONS:\n"
                        "- If errorMessage is present and not null → classify the login as FAILED.\n"
                        "- If errorMessage is missing or null → classify the login as SUCCESSFUL.\n\n"

                        "For each login event:\n"
                        "- State whether it was SUCCESSFUL or FAILED based on the above rule.\n"
                        "- Summarize by date and number of attempts.\n"
                        "- Group multiple identical API calls unless timestamps differ.\n"
                        "- Group events by user and IP address when summarizing.\n\n"

                        "LIMITING RESULTS:\n"
                        "- If the user requests a limited number (e.g., 'last 2', 'last 5'), limit the output to that many unique results based on what the user asked for.\n"
                        "- The type of result to limit (API calls, IP addresses, logins, usernames, etc.) depends on the user's intent and question.\n"
                        "- Infer the correct grouping or dimension from the user's request.\n"
                        "- Do not assume any default grouping (such as API calls) unless the user's request makes it clear.\n"
                        "- Apply the limit to logical groups or summarized items, not to raw event rows.\n\n"

                        "PRESENTATION:\n"
                        "- Number the results (1., 2., 3., etc.).\n\n"
                        "If the events are not related, respond with: 'No relevant events found.'\n\n"

                        "Do this summarization as witty AI summarizer. Turn the following AWS CloudTrail events into a short, humorous summary. \n"
                        "Make light-hearted jokes or puns about the API calls, users, or services involved. Keep it friendly and funny. \n"
                        "Do not invent data. Here are the events:\n"
                    )

                # Kids
                elif any(word in user_input.lower() for word in ["kid", "kindergarden", "small", "child", "childish"]):
                    prompt = user_question_intro + (
                        f"You are summarizing AWS CloudTrail events for the intent '{intent_name}'.\n"
                        "ONLY include relevant events matching all of these:\n"
                        "- The requested account ID (if provided)\n"
                        "- The requested IP address (if provided)\n"
                        "- The requested timeframe (if provided)\n\n"

                        "Do not require usernames because failed login attempts may not have usernames.\n\n"

                        "IMPORTANT INSTRUCTIONS:\n"
                        "- If errorMessage is present and not null → classify the login as FAILED.\n"
                        "- If errorMessage is missing or null → classify the login as SUCCESSFUL.\n\n"

                        "For each login event:\n"
                        "- State whether it was SUCCESSFUL or FAILED based on the above rule.\n"
                        "- Summarize by date and number of attempts.\n"
                        "- Group multiple identical API calls unless timestamps differ.\n"
                        "- Group events by user and IP address when summarizing.\n\n"

                        "LIMITING RESULTS:\n"
                        "- If the user requests a limited number (e.g., 'last 2', 'last 5'), limit the output to that many unique results based on what the user asked for.\n"
                        "- The type of result to limit (API calls, IP addresses, logins, usernames, etc.) depends on the user's intent and question.\n"
                        "- Infer the correct grouping or dimension from the user's request.\n"
                        "- Do not assume any default grouping (such as API calls) unless the user's request makes it clear.\n"
                        "- Apply the limit to logical groups or summarized items, not to raw event rows.\n\n"

                        "PRESENTATION:\n"
                        "- Number the results (1., 2., 3., etc.).\n\n"

                        "If the events are not related, respond with: 'No relevant events found.'\n\n"

                        "Do this summarization as the user is a small child Turn the following AWS CloudTrail events into a short, but minors-friendly summary. \n"
                        "Use examples as the toys, or sweets so kids can easily imagine that. \n"
                        "Do not invent data. Here are the events:\n"
                    )

                ## Prompts without user input
                else:
                    prompt = user_question_intro + (
                        f"You are summarizing AWS CloudTrail events for the intent '{intent_name}'.\n"
                        "ONLY include relevant events matching all of these:\n"
                        "- The requested account ID (if provided)\n"
                        "- The requested IP address (if provided)\n"
                        "- The requested timeframe (if provided)\n\n"

                        "Do not require usernames because failed login attempts may not have usernames.\n\n"

                        "IMPORTANT INSTRUCTIONS:\n"
                        "- If errorMessage is present and not null → classify the login as FAILED.\n"
                        "- If errorMessage is missing or null → classify the login as SUCCESSFUL.\n\n"

                        "For each login event:\n"
                        "- State whether it was SUCCESSFUL or FAILED based on the above rule.\n"
                        "- Summarize by date and number of attempts.\n"
                        "- Group multiple identical API calls unless timestamps differ.\n"
                        "- Group events by user and IP address when summarizing.\n\n"

                        "LIMITING RESULTS:\n"
                        "- If the user requests a limited number (e.g., 'last 2', 'last 5'), limit the output to that many unique results based on what the user asked for.\n"
                        "- The type of result to limit (API calls, IP addresses, logins, usernames, etc.) depends on the user's intent and question.\n"
                        "- Infer the correct grouping or dimension from the user's request.\n"
                        "- Do not assume any default grouping (such as API calls) unless the user's request makes it clear.\n"
                        "- Apply the limit to logical groups or summarized items, not to raw event rows.\n\n"

                        "PRESENTATION:\n"
                        "- Number the results (1., 2., 3., etc.).\n\n"

                        "If no relevant events are found, respond with: 'No relevant events found.'\n\n"
                        "Do not invent data. Here are the events:\n"
                    )

                # for event in events_list[:10]: # PROBLEM 4

                max_events = limit_number if limit_number else 30  # Default to 30 if no number requested
                for event in events_list[:max_events]:
                    prompt += json.dumps(event) + "\n"
                print("Prompt sent to Bedrock:", prompt)

                try:
                    print(f"Using Bedrock converse API with model: {BEDROCK_MODEL_ID}")

                    response = bedrock_runtime.converse(
                        modelId=BEDROCK_MODEL_ID,
                        messages=[
                            {
                                "role": "user",
                                "content": [
                                    {
                                        "text": prompt
                                    }
                                ]
                            }
                        ],
                        inferenceConfig={
                            "maxTokens": 500,
                            "temperature": 0.5,
                            "topP": 0.9
                        }
                    )

                    print("Response from Bedrock (converse API):")
                    if 'output' in response and 'message' in response['output']:
                        message = response['output']['message']
                        if 'content' in message:
                            for content_item in message['content']:
                                if 'text' in content_item:
                                    summary = content_item['text']
                                    print(f"Generated summary: {summary}")
                                    return summary

                    return "No summary generated from Bedrock."

                except Exception as e:
                    print(f"Error using Bedrock converse API: {str(e)}")
                    return f"Could not summarize the logs: {str(e)}"

            def lambda_handler(event, context):
                print("Received event:", json.dumps(event, indent=2))
                try:
                    user_input, intent_name, slots = parse_lex_event(event)
                    print(f"Intent detected: {intent_name}")
                    print(f"User said: {user_input}")

                    accountid = slots.get('accountid', {}).get('value', {}).get('interpretedValue')
                    if not accountid:
                        message = "Please repeat the question and specify an AWS Account ID to proceed."
                        return {
                            "sessionState": {
                                "dialogAction": {
                                    "type": "Close"
                                },
                                "intent": {
                                    "name": intent_name,
                                    "state": "Fulfilled"
                                }
                            },
                            "messages": [
                                {
                                    "contentType": "PlainText",
                                    "content": message
                                }
                            ]
                        }

                    query_statement = build_query(intent_name, slots)
                    query_id = start_cloudtrail_query(query_statement)

                    limit_number = extract_number(user_input)
                    
                    if query_id:
                        results = get_query_results(query_id)
                        print("Full event list:", json.dumps(results, indent=2))
                        # summary = summarize_with_bedrock(results, intent_name, user_input)
                        summary = summarize_with_bedrock(results, intent_name, user_input, limit_number)
                        message = summary
                    else:
                        message = "Sorry, there was an error starting the query."

                except Exception as e:
                    print(f"Unhandled error: {e}")
                    message = "Sorry, an internal error occurred. Please try again later."

                return {
                    "sessionState": {
                        "dialogAction": {
                            "type": "Close"
                        },
                        "intent": {
                            "name": intent_name,
                            "state": "Fulfilled"
                        }
                    },
                    "messages": [
                        {
                            "contentType": "PlainText",
                            "content": message
                        }
                    ]
                }

Outputs:
  LttmMainFunctionArn:
    Value: !GetAtt LttmMainFunction.Arn
    Export:
      Name: LttmMainFunctionArn
