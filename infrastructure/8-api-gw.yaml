---
AWSTemplateFormatVersion: '2010-09-09'
Description: LTTMv2 API Gateway to invoke lttm-v2-lambda-intent function

# Parameters:
#   LttmV2LambdaIntentArn:
#     Type: String
#     Description: ARN of the lambda_intent function
#     Default: !ImportValue LttmLambdaIntentArn

Resources:
  LttmV2ApiGw:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: lttm-v2-api-gw
      ProtocolType: HTTP

  LttmV2ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref LttmV2ApiGw
      IntegrationType: AWS_PROXY
      IntegrationUri: !ImportValue LttmLambdaIntentArn
      PayloadFormatVersion: '2.0'

  LttmV2ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref LttmV2ApiGw
      RouteKey: POST /invoke
      Target: !Join [ '/', [ 'integrations', !Ref LttmV2ApiIntegration ] ]

  LttmV2ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref LttmV2ApiGw
      StageName: prod
      AutoDeploy: true

  LambdaV2InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !ImportValue LttmLambdaIntentArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${LttmV2ApiGw}/*/*/invoke

Outputs:
  LttmV2ApiInvokeUrl:
    Description: URL to invoke lambda-intent via API Gateway
    Value: !Sub https://${LttmV2ApiGw}.execute-api.${AWS::Region}.amazonaws.com/prod/invoke
    Export:
      Name: LttmV2ApiInvokeUrl
